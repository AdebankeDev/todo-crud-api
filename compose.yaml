services:

  db:
    image: postgres:17
    container_name: taskdb
    env_file:
      - .env.docker
    volumes:
      - taskdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tasks"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: task-api
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.docker
    ports:
      - "8000:8000"

volumes:
  taskdata: